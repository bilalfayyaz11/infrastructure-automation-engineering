---
apiVersion: awx.ansible.com/v1beta1
kind: AWX

metadata:
  name: platform-awx
  namespace: awx

spec:
  admin_user: admin
  admin_password_secret: platform-awx-admin-password
  secret_key_secret: platform-awx-secret-key

  service_type: NodePort
  nodeport_port: 30080

  postgres_storage_class: local-path
  postgres_storage_requirements:
    requests:
      storage: 4Gi

  projects_persistence: false

  web_replicas: 1
  task_replicas: 1

  web_resource_requirements:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  task_resource_requirements:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 3Gi

  postgres_resource_requirements:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
