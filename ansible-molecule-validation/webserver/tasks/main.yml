---
- name: Update apt package metadata
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Apache web server
  ansible.builtin.apt:
    name: "{{ webserver_package_name }}"
    state: present

- name: Ensure Apache listens on the configured port
  ansible.builtin.lineinfile:
    path: /etc/apache2/ports.conf
    regexp: '^Listen[[:space:]]+[0-9]+$'
    line: "Listen {{ webserver_port }}"
    validate: /usr/sbin/apache2ctl -t -f %s
  notify: Restart Apache

- name: Deploy managed web page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ webserver_document_root }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
  notify: Reload Apache

- name: Ensure Apache service is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ webserver_service_name }}"
    enabled: true
    state: started

- name: Wait for Apache to listen
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ webserver_port }}"
    timeout: 30
