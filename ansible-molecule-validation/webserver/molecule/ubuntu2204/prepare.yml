---
- name: Prepare
  hosts: all
  gather_facts: false

  tasks:
    - name: Install Python and systemd prerequisites
      ansible.builtin.raw: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y \
          python3 \
          python3-apt \
          sudo \
          systemd \
          systemd-sysv \
          curl
      changed_when: true
