---
all:
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    ansible_connection: local

  children:
    onpremises:
      hosts:
        onprem-server:
          ansible_host: localhost
          environment_type: onpremises
          datacenter: local-dc
          docker_network: onprem-network
          storage_root: /opt/onprem-data

    cloud:
      hosts:
        cloud-server:
          ansible_host: localhost
          environment_type: cloud
          datacenter: aws-us-east-1
          docker_network: cloud-network
          storage_root: /opt/cloud-data
